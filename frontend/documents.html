<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documents - Office Automation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="sidebar-container"></div>

  <div class="main-content">
    <div class="container">
    <div id="message" class="alert" style="display: none;"></div>

    <div class="card">
      <h3>📤 Upload Document</h3>
      <form id="docForm" enctype="multipart/form-data">
        <div class="form-group">
          <label>Select File</label>
          <input type="file" name="document" id="docInput" required>
        </div>
        <button type="button" class="btn-primary" onclick="uploadDocument()">Upload</button>
      </form>
    </div>

    <div class="card">
      <h3>📋 Document List</h3>
      <table>
        <thead>
          <tr>
            <th>Filename</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="docList">
          <tr>
            <td colspan="2" style="text-align: center;">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  </div>

  <script>
    // Load Sidebar
    fetch('sidebar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('sidebar-container').innerHTML = data;
        const scripts = document.getElementById('sidebar-container').getElementsByTagName('script');
        for(let script of scripts) {
          eval(script.innerText);
        }
      });

    let currentUser = null;

    function loadDocuments() {
      const user = JSON.parse(localStorage.getItem("user"));
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      currentUser = user;

      const docList = document.getElementById("docList");
      docList.innerHTML = '<tr><td colspan="2" style="text-align: center;">📁 No documents uploaded yet</td></tr>';
    }

    function uploadDocument() {
      const fileInput = document.getElementById("docInput");
      if (!fileInput.files.length) {
        showMessage("Please select a file", "error");
        return;
      }

      const formData = new FormData();
      formData.append("document", fileInput.files[0]);

      fetch("http://localhost:3000/api/documents/upload", {
        method: "POST",
        headers: {
          "userid": currentUser.id,
          "role": currentUser.role
        },
        body: formData
      })
        .then(res => res.json())
        .then(() => {
          showMessage("Document uploaded successfully!", "success");
          fileInput.value = "";
          loadDocuments();
        })
        .catch(() => showMessage("Error uploading document", "error"));
    }

    function showMessage(msg, type) {
      const div = document.getElementById("message");
      div.textContent = msg;
      div.className = `alert ${type}`;
      div.style.display = "block";
    }

    function logout(e) {
      e.preventDefault();
      localStorage.removeItem("user");
      window.location.href = "index.html";
    }

    window.onload = loadDocuments;
  </script>
  </div>
</body>
</html>
