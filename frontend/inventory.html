<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory - Office Automation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="sidebar-container"></div>

  <div class="main-content">
    <div class="container">
    <div id="message" class="alert" style="display: none;"></div>

    <div class="card">
      <h3>📊 Inventory Statistics</h3>
      <div class="grid">
        <div style="text-align: center;">
          <h4 id="totalItems">0</h4>
          <p>Total Items</p>
        </div>
        <div style="text-align: center;">
          <h4 id="lowStock">0</h4>
          <p>Low Stock Items</p>
        </div>
        <div style="text-align: center;">
          <h4 id="totalValue">₹0</h4>
          <p>Total Value</p>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>➕ Add Item to Inventory</h3>
      <div class="grid">
        <div>
          <label>Item Name</label>
          <input type="text" id="itemName" placeholder="Item name">
        </div>
        <div>
          <label>Category</label>
          <input type="text" id="itemCategory" placeholder="Category">
        </div>
      </div>
      <div class="grid">
        <div>
          <label>Quantity</label>
          <input type="number" id="itemQty" min="0">
        </div>
        <div>
          <label>Min Quantity</label>
          <input type="number" id="itemMin" min="0">
        </div>
        <div>
          <label>Unit Price</label>
          <input type="number" id="itemPrice" step="0.01">
        </div>
      </div>
      <div class="grid">
        <div>
          <label>Supplier</label>
          <input type="text" id="itemSupplier" placeholder="Supplier name">
        </div>
        <div>
          <label>Location</label>
          <input type="text" id="itemLocation" placeholder="Storage location">
        </div>
      </div>
      <button class="btn-primary" onclick="addItem()">Add Item</button>
    </div>

    <div class="card">
      <h3>📋 Inventory Items</h3>
      <table>
        <thead>
          <tr>
            <th>Item Name</th>
            <th>Category</th>
            <th>Quantity</th>
            <th>Unit Price</th>
            <th>Total Value</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="inventoryTable">
          <tr>
            <td colspan="7" style="text-align: center;">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Load Sidebar
    fetch('sidebar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('sidebar-container').innerHTML = data;
        const scripts = document.getElementById('sidebar-container').getElementsByTagName('script');
        for(let script of scripts) {
          eval(script.innerText);
        }
      });

    let currentUser = null;

    function loadPage() {
      const user = JSON.parse(localStorage.getItem("user"));
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      currentUser = user;
      loadInventory();
      loadStats();
    }

    function loadInventory() {
      fetch(`http://localhost:3000/api/inventory/`, {
        headers: {
          "userid": currentUser.id,
          "role": currentUser.role
        }
      })
        .then(res => res.json())
        .then(items => {
          const tbody = document.getElementById("inventoryTable");
          if (!items || items.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7">No items in inventory</td></tr>';
            return;
          }

          tbody.innerHTML = items.map(i => {
            const status = i.quantity <= i.minQuantity ? 'low-stock' : (i.quantity < 10 ? 'warning' : 'ok');
            return `
              <tr>
                <td>${i.item}</td>
                <td>${i.category || '-'}</td>
                <td>${i.quantity}</td>
                <td>₹${i.unitPrice || 0}</td>
                <td>₹${(i.quantity * (i.unitPrice || 0)).toFixed(2)}</td>
                <td><span class="badge ${status}">${status === 'low-stock' ? 'Low Stock' : 'In Stock'}</span></td>
                <td><button onclick="adjustItem(${i.id})" style="width: 100%; padding: 5px;">Adjust</button></td>
              </tr>
            `;
          }).join("");
        })
        .catch(err => {
          console.error(err);
          document.getElementById("inventoryTable").innerHTML = '<tr><td colspan="7" style="color: red;">Error loading inventory</td></tr>';
        });
    }

    function loadStats() {
      fetch(`http://localhost:3000/api/inventory/analytics/summary`, {
        headers: {
          "userid": currentUser.id,
          "role": currentUser.role
        }
      })
        .then(res => res.json())
        .then(stats => {
          document.getElementById("totalItems").textContent = stats.totalItems || 0;
          document.getElementById("lowStock").textContent = stats.lowStockItems || 0;
          document.getElementById("totalValue").textContent = '₹' + (stats.totalValue || 0);
        })
        .catch(err => console.error(err));
    }

    function addItem() {
      const item = document.getElementById("itemName").value;
      const category = document.getElementById("itemCategory").value;
      const quantity = document.getElementById("itemQty").value;
      const minQuantity = document.getElementById("itemMin").value;
      const unitPrice = document.getElementById("itemPrice").value;
      const supplier = document.getElementById("itemSupplier").value;
      const location = document.getElementById("itemLocation").value;

      if (!item || !quantity) {
        showMessage("Please fill in required fields", "error");
        return;
      }

      fetch("http://localhost:3000/api/inventory/add", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "userid": currentUser.id,
          "role": currentUser.role
        },
        body: JSON.stringify({
          item,
          category,
          quantity: parseInt(quantity),
          minQuantity: parseInt(minQuantity) || 0,
          unitPrice: parseFloat(unitPrice) || 0,
          supplier,
          location
        })
      })
        .then(res => res.json())
        .then(() => {
          showMessage("Item added!", "success");
          document.getElementById("itemName").value = "";
          document.getElementById("itemCategory").value = "";
          document.getElementById("itemQty").value = "";
          document.getElementById("itemMin").value = "";
          document.getElementById("itemPrice").value = "";
          document.getElementById("itemSupplier").value = "";
          document.getElementById("itemLocation").value = "";
          loadInventory();
          loadStats();
        })
        .catch(() => showMessage("Error adding item", "error"));
    }

    function adjustItem(itemId) {
      const qty = prompt("Enter quantity adjustment (+ or -):");
      if (qty === null) return;

      const reason = prompt("Reason for adjustment:");

      fetch(`http://localhost:3000/api/inventory/adjust/${itemId}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "userid": currentUser.id,
          "role": currentUser.role
        },
        body: JSON.stringify({ quantity: parseInt(qty), reason })
      })
        .then(res => res.json())
        .then(() => {
          showMessage("Inventory adjusted!", "success");
          loadInventory();
          loadStats();
        })
        .catch(() => showMessage("Error adjusting inventory", "error"));
    }

    function showMessage(message, type) {
      const msgDiv = document.getElementById("message");
      msgDiv.textContent = message;
      msgDiv.className = `alert ${type}`;
      msgDiv.style.display = "block";
      setTimeout(() => {
        msgDiv.style.display = "none";
      }, 3000);
    }

    function logout(e) {
      e.preventDefault();
      localStorage.removeItem("user");
      window.location.href = "index.html";
    }

    window.onload = loadInventory;
  </script>
    </div>
  </div>
</body>
</html>
