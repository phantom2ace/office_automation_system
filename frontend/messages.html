<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Office Automation</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Full height layout adjustments */
        body {
            overflow: hidden;
        }

        .main-content {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-bottom: 0 !important;
        }

        .container {
            height: 100% !important;
            display: flex;
            flex-direction: column;
            padding-bottom: 20px;
        }

        .chat-layout {
            display: flex;
            flex: 1;
            height: auto; /* Fill remaining space */
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        /* Sidebar */
        .chat-sidebar {
            width: 320px;
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .chat-sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding-left: 36px;
            background: var(--bg-dark);
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8rem;
            opacity: 0.5;
        }

        .users-list {
            flex: 1;
            overflow-y: auto;
        }

        .user-item {
            padding: 16px 20px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .user-item:hover {
            background: var(--bg-hover);
        }

        .user-item.active {
            background: rgba(99, 102, 241, 0.1); /* Primary color low opacity */
            border-left: 3px solid var(--primary-color);
        }

        .avatar {
            width: 44px;
            height: 44px;
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        /* Main Chat Area */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-dark); /* Contrast with sidebar */
        }

        .chat-header {
            padding: 16px 24px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 16px;
            height: 76px;
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            position: relative;
            line-height: 1.5;
            font-size: 0.95rem;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .message.sent {
            align-self: flex-end;
            background: var(--primary-color);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            align-self: flex-start;
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
            display: block;
        }

        .chat-input-area {
            padding: 20px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-input-area input {
            background: var(--bg-dark);
            border-radius: 24px;
            padding: 12px 20px;
        }

        .btn-send {
            border-radius: 50%;
            width: 48px;
            height: 48px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-muted);
            display: inline-block;
        }
        .status-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
    </style>
</head>
<body>
    <div style="display: flex; height: 100vh; overflow: hidden;">
        <!-- Sidebar container -->
        <div id="sidebar-container"></div>

        <div class="main-content">
            <div class="container" style="max-width: 1400px; height: 100%;">
                
                <div class="flex justify-between items-center mb-4">
                    <h2>💬 Messages</h2>
                    <div class="flex items-center gap-2">
                        <span id="connectionStatus" class="badge warning">Connecting...</span>
                    </div>
                </div>

                <div class="chat-layout">
                    <!-- Users Sidebar -->
                    <div class="chat-sidebar">
                        <div class="chat-sidebar-header">
                            <div class="search-box">
                                <input type="text" placeholder="Search colleagues..." onkeyup="filterUsers(this.value)">
                            </div>
                        </div>
                        <div class="users-list" id="usersList">
                            <div style="padding: 20px; text-align: center; color: var(--text-muted);">Loading users...</div>
                        </div>
                    </div>

                    <!-- Chat Main Area -->
                    <div class="chat-main">
                        <div class="chat-header" id="chatHeader" style="display: none;">
                            <div class="avatar" id="headerAvatar"></div>
                            <div>
                                <h3 id="headerName" style="margin: 0; font-size: 1.1rem;">Select a user</h3>
                                <p class="text-muted" style="font-size: 0.85rem; margin: 0;">Online</p>
                            </div>
                        </div>
                        
                        <div class="chat-messages" id="chatMessages">
                            <div class="empty-state">
                                <div style="font-size: 4rem; margin-bottom: 20px;">👋</div>
                                <h3>Select a colleague to start chatting</h3>
                                <p>Secure, real-time messaging for your office.</p>
                            </div>
                        </div>

                        <div class="chat-input-area" id="inputArea" style="display: none;">
                            <button class="btn-secondary" style="border-radius: 50%; width: 40px; height: 40px; padding: 0;">📎</button>
                            <input type="text" id="messageInput" placeholder="Type your message..." onkeypress="handleEnter(event)">
                            <button class="btn-send" onclick="sendMessage()">➤</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Socket.IO Client -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Load Sidebar
        fetch('sidebar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('sidebar-container').innerHTML = data;
                const scripts = document.getElementById('sidebar-container').getElementsByTagName('script');
                for(let script of scripts) {
                    eval(script.innerText);
                }
            });

        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) window.location.href = 'index.html';

        window.socket = io();
        const socket = window.socket;
        
        window.currentChatId = null;
        let allUsers = [];

        // Socket Connection Status
        socket.on('connect', () => {
            const badge = document.getElementById('connectionStatus');
            badge.textContent = 'Online';
            badge.className = 'badge success';
            socket.emit('join_room', user.id);
        });

        socket.on('connect_error', (err) => {
            const badge = document.getElementById('connectionStatus');
            badge.textContent = 'Connection Error';
            badge.className = 'badge danger';
            console.error('Socket connection error:', err);
        });

        socket.on('disconnect', () => {
            const badge = document.getElementById('connectionStatus');
            badge.textContent = 'Offline';
            badge.className = 'badge inactive';
        });

        // Listen for incoming messages
        socket.on('receive_message', (data) => {
            if (window.currentChatId && (data.senderId == window.currentChatId || data.receiverId == window.currentChatId)) {
                appendMessage(data, data.senderId == user.id ? 'sent' : 'received');
                scrollToBottom();
                
                // If we are chatting with this person, mark as read immediately
                if (data.senderId == window.currentChatId) {
                    fetch(`/api/messages/mark-read/${data.senderId}`, {
                        method: 'PUT',
                        headers: { 'userid': user.id, 'role': user.role }
                    }).then(() => {
                         if (window.updateUnreadCount) window.updateUnreadCount();
                    });
                }
            } else {
                // Update local unread map
                if (!unreadMap[data.senderId]) unreadMap[data.senderId] = 0;
                unreadMap[data.senderId]++;
                renderUsers(allUsers); // Re-render to show new count

                // Show notification dot on user list (fallback)
                const userItem = document.getElementById(`user-${data.senderId}`);
                if (userItem) {
                    userItem.style.background = 'rgba(99, 102, 241, 0.2)'; // Highlight
                }
            }
        });

        // Load Users and Unread Counts
        function loadData() {
            const headers = { 
                'userid': user.id, 
                'role': user.role 
            };

            Promise.all([
                fetch('/api/users', { headers }).then(r => {
                    if (!r.ok) throw new Error('Failed to load users: ' + r.statusText);
                    return r.json();
                }),
                fetch('/api/messages/unread/senders', { headers }).then(r => {
                    if (!r.ok) throw new Error('Failed to load unread counts: ' + r.statusText);
                    return r.json();
                })
            ])
            .then(([users, unreadData]) => {
                if (!Array.isArray(users)) throw new Error('Invalid users response');
                
                allUsers = users.filter(u => u.id !== user.id); // Exclude self
                
                unreadMap = {};
                if(Array.isArray(unreadData)) {
                    unreadData.forEach(item => {
                        unreadMap[item.senderId] = item.count;
                    });
                }

                renderUsers(allUsers);
            })
            .catch(err => {
                console.error("Error loading data:", err);
                document.getElementById('usersList').innerHTML = `
                    <div style="padding: 20px; text-align: center; color: var(--danger);">
                        <p>Failed to load data</p>
                        <button class="btn-secondary" onclick="loadData()">Retry</button>
                    </div>`;
            });
        }
        
        loadData(); // Initial load

        function renderUsers(users) {
            const list = document.getElementById('usersList');
            if(users.length === 0) {
                list.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted);">No users found</div>';
                return;
            }
            list.innerHTML = users.map(u => {
                const unreadCount = unreadMap[u.id] || 0;
                const badgeHtml = unreadCount > 0 
                    ? `<div style="background: #ff4757; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold;">${unreadCount > 99 ? '99+' : unreadCount}</div>` 
                    : '';

                return `
                <div class="user-item" id="user-${u.id}" onclick="selectUser(${u.id}, '${u.name}', '${u.department || 'Employee'}')">
                    <div class="avatar">${u.name.charAt(0).toUpperCase()}</div>
                    <div style="flex: 1;">
                        <h4 style="margin: 0; font-size: 0.95rem; color: var(--text-main);">${u.name}</h4>
                        <p style="margin: 0; font-size: 0.8rem; color: var(--text-muted);">${u.department || 'Employee'}</p>
                    </div>
                    ${badgeHtml}
                </div>
            `}).join('');
        }

        function filterUsers(query) {
            if (!query) {
                renderUsers(allUsers);
                return;
            }
            
            // Client-side quick filter for small lists
            if (allUsers.length < 50) {
                const filtered = allUsers.filter(u => 
                    u.name.toLowerCase().includes(query.toLowerCase()) || 
                    (u.email && u.email.toLowerCase().includes(query.toLowerCase()))
                );
                renderUsers(filtered);
            } 
            
            // Server-side search for larger lists or when specific query is needed
            if (query.length >= 2) {
                fetch(`/api/messages/search/staff?query=${encodeURIComponent(query)}`, {
                    headers: { 'userid': user.id, 'Authorization': user.token }
                })
                .then(res => res.json())
                .then(users => {
                     // Merge with local unread counts if possible, or just render
                     renderUsers(users);
                })
                .catch(err => console.error("Search error:", err));
            }
        }

        function selectUser(userId, userName, userDept) {
            window.currentChatId = userId;
            
            // Clear local unread count and update UI
            if (unreadMap[userId]) {
                unreadMap[userId] = 0;
                renderUsers(allUsers);
            }

            // UI Updates
            document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.getElementById(`user-${userId}`);
            if(activeItem) {
                activeItem.classList.add('active');
                activeItem.style.background = ''; // Remove notification highlight
            }
            
            document.getElementById('chatHeader').style.display = 'flex';
            document.getElementById('inputArea').style.display = 'flex';
            document.getElementById('headerName').textContent = userName;
            document.getElementById('headerAvatar').textContent = userName.charAt(0).toUpperCase();
            document.getElementById('headerAvatar').style.display = 'flex';

            loadMessages(userId);
            
            // Focus input
            setTimeout(() => document.getElementById('messageInput').focus(), 100);
        }

        function loadMessages(otherUserId) {
            const chatBox = document.getElementById('chatMessages');
            chatBox.innerHTML = '<div style="display: flex; justify-content: center; padding: 40px;"><div class="loader">Loading...</div></div>';

            fetch(`/api/messages/history/${otherUserId}`, {
                headers: { 'userid': user.id, 'Authorization': user.token }
            })
            .then(res => res.json())
            .then(messages => {
                chatBox.innerHTML = '';
                if(messages.length === 0) {
                    chatBox.innerHTML = `
                        <div class="empty-state">
                            <div style="font-size: 3rem; margin-bottom: 10px;">👋</div>
                            <p>No messages yet.<br>Start the conversation with <strong>${document.getElementById('headerName').textContent}</strong>!</p>
                        </div>
                    `;
                } else {
                    messages.forEach(msg => {
                        const type = msg.senderId == user.id ? 'sent' : 'received';
                        appendMessage(msg, type);
                    });
                    scrollToBottom();
                }
            })
            .catch(err => {
                console.error(err);
                chatBox.innerHTML = '<div class="empty-state text-danger">Error loading messages</div>';
            });
        }

        function appendMessage(msg, type) {
            const box = document.getElementById('chatMessages');
            // Remove empty state if present
            if (box.querySelector('.empty-state')) box.innerHTML = '';

            const div = document.createElement('div');
            div.className = `message ${type}`;
            const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            div.innerHTML = `
                ${msg.content}
                <span class="message-time">${time}</span>
            `;
            box.appendChild(div);
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            
            if (!content || !window.currentChatId) return;

            const messageData = {
                senderId: user.id,
                receiverId: window.currentChatId,
                content: content,
                timestamp: new Date().toISOString()
            };

            // Optimistic UI
            appendMessage(messageData, 'sent');
            scrollToBottom();
            input.value = '';

            // Send to Server
            socket.emit('send_message', messageData);
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function scrollToBottom() {
            const box = document.getElementById('chatMessages');
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
