<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Management - Office Automation</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .leave-balance-card {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      padding: 24px;
      border-radius: var(--radius-md);
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <div style="display: flex;">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div class="container">
        <div id="message" class="alert" style="display: none;"></div>

        <div class="header-actions">
          <h1>🏖️ Leave Management</h1>
        </div>

        <!-- Leave Application -->
        <div class="card">
          <h3 class="mb-4">📝 Apply for Leave</h3>
          <form id="leaveForm" onsubmit="applyLeave(event)">
            <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 20px;">
              <div class="form-group">
                <label>Leave Type</label>
                <select id="leaveType" required>
                  <option value="Sick Leave">Sick Leave</option>
                  <option value="Casual Leave">Casual Leave</option>
                  <option value="Annual Leave">Annual Leave</option>
                  <option value="Maternity Leave">Maternity Leave</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="form-group">
                <label>Number of Days</label>
                <input type="number" id="leaveDays" min="0.5" step="0.5" required>
              </div>
            </div>
            <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 20px;">
              <div class="form-group">
                <label>Start Date</label>
                <input type="date" id="startDate" required>
              </div>
              <div class="form-group">
                <label>End Date</label>
                <input type="date" id="endDate" required>
              </div>
            </div>
            <div class="form-group">
              <label>Reason</label>
              <textarea id="leaveReason" rows="3" placeholder="Reason for leave" required></textarea>
            </div>
            <button type="submit" class="btn-primary">Submit Application</button>
          </form>
        </div>

        <!-- My Leaves -->
        <div class="card">
          <h3 class="mb-4">📋 My Leave History</h3>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Type</th>
                  <th>Dates</th>
                  <th>Days</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="myLeaves">
                <tr>
                  <td colspan="5" class="text-center">Loading...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Manager Approvals -->
        <div id="approvalSection" class="card" style="display: none;">
          <h3 class="mb-4">✅ Pending Approvals</h3>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Employee</th>
                  <th>Type</th>
                  <th>Dates</th>
                  <th>Days</th>
                  <th>Reason</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="approvalTable">
                <tr><td colspan="6" class="text-center">No pending approvals</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Load Sidebar
    fetch('sidebar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('sidebar-container').innerHTML = data;
        const scripts = document.getElementById('sidebar-container').getElementsByTagName('script');
        for(let script of scripts) {
          eval(script.innerText);
        }
      });

    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) window.location.href = 'index.html';

    // Show Manager Section
    if (['Manager', 'Admin'].includes(user.role)) {
      document.getElementById('approvalSection').style.display = 'block';
      loadApprovals();
    }

    loadMyLeaves();

    function applyLeave(e) {
      e.preventDefault();
      
      const data = {
        leaveType: document.getElementById('leaveType').value,
        days: document.getElementById('leaveDays').value,
        startDate: document.getElementById('startDate').value,
        endDate: document.getElementById('endDate').value,
        reason: document.getElementById('leaveReason').value
      };

      fetch('/api/leaves', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'userid': user.id },
        body: JSON.stringify(data)
      })
      .then(res => res.json())
      .then(() => {
        alert('Leave application submitted!');
        document.getElementById('leaveForm').reset();
        loadMyLeaves();
      })
      .catch(err => console.error(err));
    }

    function loadMyLeaves() {
      fetch(`/api/leaves/my/${user.id}`, {
        headers: { 'userid': user.id }
      })
      .then(res => res.json())
      .then(leaves => {
        const tbody = document.getElementById('myLeaves');
        if (leaves.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center">No leave history</td></tr>';
          return;
        }
        
        tbody.innerHTML = leaves.map(l => `
          <tr>
            <td style="font-weight: 500;">${l.leaveType}</td>
            <td>${l.startDate} to ${l.endDate}</td>
            <td>${l.days}</td>
            <td><span class="badge ${getStatusClass(l.status)}">${l.status}</span></td>
            <td>
              ${l.status === 'Pending' ? `<button class="btn-danger" style="padding: 4px 8px; font-size: 0.8rem;" onclick="cancelLeave(${l.id})">Cancel</button>` : '-'}
            </td>
          </tr>
        `).join('');
      });
    }

    function loadApprovals() {
      fetch('/api/leaves/pending', {
        headers: { 'userid': user.id, 'role': user.role, 'department': user.department }
      })
      .then(res => res.json())
      .then(leaves => {
        const tbody = document.getElementById('approvalTable');
        if (leaves.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center">No pending approvals</td></tr>';
          return;
        }

        tbody.innerHTML = leaves.map(l => `
          <tr>
            <td style="font-weight: 500;">${l.userName}</td>
            <td>${l.leaveType}</td>
            <td>${l.startDate} to ${l.endDate}</td>
            <td>${l.days}</td>
            <td>${l.reason}</td>
            <td>
              <div class="flex gap-2">
                <button class="btn-primary" style="background: var(--success); border: none; padding: 4px 8px; font-size: 0.8rem;" onclick="updateStatus(${l.id}, 'Approved')">Approve</button>
                <button class="btn-danger" style="padding: 4px 8px; font-size: 0.8rem;" onclick="updateStatus(${l.id}, 'Rejected')">Reject</button>
              </div>
            </td>
          </tr>
        `).join('');
      });
    }

    function updateStatus(id, status) {
      if(!confirm(`Are you sure you want to ${status.toLowerCase()} this leave?`)) return;
      
      fetch(`/api/leaves/${id}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'userid': user.id, 'role': user.role },
        body: JSON.stringify({ status })
      })
      .then(() => {
        loadApprovals();
        // Refresh my leaves if I approved my own (unlikely but possible in dev)
        loadMyLeaves(); 
      });
    }
    
    function cancelLeave(id) {
        if(!confirm('Cancel this leave request?')) return;
        // Reuse status update logic but setting to Cancelled
        fetch(`/api/leaves/${id}/status`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'userid': user.id, 'role': user.role }, // User can cancel own
            body: JSON.stringify({ status: 'Cancelled' })
        })
        .then(() => loadMyLeaves());
    }

    function getStatusClass(s) {
      if (s === 'Approved') return 'success';
      if (s === 'Rejected') return 'danger';
      if (s === 'Cancelled') return 'inactive';
      return 'warning';
    }
  </script>
</body>
</html>
