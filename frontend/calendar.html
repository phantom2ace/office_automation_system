<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar - Office Automation</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .calendar-container {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin: 20px 0;
    }
    .calendar-day {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 5px;
      min-height: 80px;
      border: 2px solid #e0e0e0;
    }
    .calendar-day.today {
      background: #fff3cd;
      border-color: #667eea;
    }
    .event-item {
      background: #667eea;
      color: white;
      padding: 5px;
      border-radius: 3px;
      font-size: 11px;
      margin: 3px 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Sidebar Navigation -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>🏢 OfficeApp</h2>
    </div>
    
    <div class="sidebar-nav">
      <a href="dashboard.html" id="nav-dashboard">📊 Dashboard</a>
      <a href="tasks.html" id="nav-tasks">✅ Tasks</a>
      <a href="messages.html" id="nav-messages">✉️ Messages</a>
      <a href="documents.html" id="nav-documents">📄 Documents</a>
      <a href="calendar.html" id="nav-calendar" class="active">📅 Calendar</a>
      <a href="leaves.html" id="nav-leaves">🏖️ Leaves</a>
      <a href="employees.html" id="nav-employees">👥 Employees</a>
      <a href="finance.html" id="nav-finance">💰 Finance</a>
      <a href="inventory.html" id="nav-inventory">📦 Inventory</a>
      <a href="resources.html" id="nav-resources">⚙️ Resources</a>
      <a href="performance.html" id="nav-performance">⭐ Performance</a>
      <a href="analytics.html" id="nav-analytics">📈 Analytics</a>
      <a href="user-management.html" id="nav-users" style="display: none;">👤 User Management</a>
    </div>

    <div class="sidebar-footer">
      <button onclick="logout(event)">🚪 Logout</button>
    </div>
  </div>

  <div class="main-content">
    <div class="container">
    <div id="message" class="alert" style="display: none;"></div>

    <div class="card">
      <h3>➕ Create Event</h3>
      <div class="form-group">
        <label>Event Title</label>
        <input type="text" id="eventTitle" placeholder="Event title">
      </div>
      <div class="grid">
        <div>
          <label>Date</label>
          <input type="date" id="eventDate">
        </div>
        <div>
          <label>Start Time</label>
          <input type="time" id="eventStart">
        </div>
        <div>
          <label>End Time</label>
          <input type="time" id="eventEnd">
        </div>
      </div>
      <div class="form-group">
        <label>Location</label>
        <input type="text" id="eventLocation" placeholder="Event location">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="eventDesc" rows="3"></textarea>
      </div>
      <button onclick="createEvent()">Create Event</button>
    </div>

    <div class="card">
      <h3>📆 Upcoming Events</h3>
      <div id="eventsList">Loading...</div>
    </div>
  </div>

  <script>
    let currentUser = null;

    function loadPage() {
      const user = JSON.parse(localStorage.getItem("user"));
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      currentUser = user;
      loadEvents();
    }

    function loadEvents() {
      fetch(`http://localhost:3000/api/calendar/${currentUser.id}`, {
        headers: {
          "userid": currentUser.id,
          "role": currentUser.role
        }
      })
        .then(res => res.json())
        .then(events => {
          const eventsList = document.getElementById("eventsList");
          if (!events || events.length === 0) {
            eventsList.innerHTML = '<p style="color: #999;">No upcoming events</p>';
            return;
          }

          eventsList.innerHTML = events.map(e => `
            <div style="background: #f9f9f9; padding: 15px; margin: 10px 0; border-left: 4px solid #667eea; border-radius: 5px;">
              <strong>${e.title}</strong><br>
              📅 ${new Date(e.eventDate).toLocaleDateString()}<br>
              ${e.startTime ? '🕐 ' + e.startTime + ' - ' + e.endTime : ''}<br>
              ${e.location ? '📍 ' + e.location : ''}
            </div>
          `).join("");
        })
        .catch(err => {
          console.error(err);
          document.getElementById("eventsList").innerHTML = '<p style="color: red;">Error loading events</p>';
        });
    }

    function createEvent() {
      const title = document.getElementById("eventTitle").value;
      const date = document.getElementById("eventDate").value;
      const startTime = document.getElementById("eventStart").value;
      const endTime = document.getElementById("eventEnd").value;
      const location = document.getElementById("eventLocation").value;
      const desc = document.getElementById("eventDesc").value;

      if (!title || !date) {
        showMessage("Please fill in required fields", "error");
        return;
      }

      fetch("http://localhost:3000/api/calendar/create", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "userid": currentUser.id,
          "role": currentUser.role
        },
        body: JSON.stringify({
          title, eventDate: date, startTime, endTime, location, description: desc
        })
      })
        .then(res => res.json())
        .then(() => {
          showMessage("Event created!", "success");
          document.getElementById("eventTitle").value = "";
          document.getElementById("eventDate").value = "";
          document.getElementById("eventStart").value = "";
          document.getElementById("eventEnd").value = "";
          document.getElementById("eventLocation").value = "";
          document.getElementById("eventDesc").value = "";
          loadEvents();
        })
        .catch(() => showMessage("Error creating event", "error"));
    }

    function showMessage(msg, type) {
      const div = document.getElementById("message");
      div.textContent = msg;
      div.className = `alert ${type}`;
      div.style.display = "block";
    }

    function logout(e) {
      e.preventDefault();
      localStorage.removeItem("user");
      window.location.href = "index.html";
    }

    window.onload = loadPage;
  </script>
  </div>
</body>
</html>
