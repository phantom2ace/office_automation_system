<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance - Office Automation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Sidebar Navigation -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>🏢 OfficeApp</h2>
    </div>
    
    <div class="sidebar-nav">
      <a href="dashboard.html" id="nav-dashboard">📊 Dashboard</a>
      <a href="tasks.html" id="nav-tasks">✅ Tasks</a>
      <a href="messages.html" id="nav-messages">✉️ Messages</a>
      <a href="documents.html" id="nav-documents">📄 Documents</a>
      <a href="calendar.html" id="nav-calendar">📅 Calendar</a>
      <a href="leaves.html" id="nav-leaves">🏖️ Leaves</a>
      <a href="employees.html" id="nav-employees">👥 Employees</a>
      <a href="finance.html" id="nav-finance" class="active">💰 Finance</a>
      <a href="inventory.html" id="nav-inventory">📦 Inventory</a>
      <a href="resources.html" id="nav-resources">⚙️ Resources</a>
      <a href="performance.html" id="nav-performance">⭐ Performance</a>
      <a href="analytics.html" id="nav-analytics">📈 Analytics</a>
      <a href="user-management.html" id="nav-users" style="display: none;">👤 User Management</a>
    </div>

    <div class="sidebar-footer">
      <button onclick="logout(event)">🚪 Logout</button>
    </div>
  </div>

  <div class="main-content">
    <div class="container">
    <div id="message" class="alert" style="display: none;"></div>

    <div class="grid">
      <div class="card">
        <h3>➕ Add Transaction</h3>
        <div class="form-group">
          <label>Description</label>
          <input type="text" id="desc" placeholder="Transaction description">
        </div>
        <div class="form-group">
          <label>Amount</label>
          <input type="number" id="amount" step="0.01" placeholder="Amount">
        </div>
        <div class="form-group">
          <label>Type</label>
          <select id="type">
            <option value="Income">Income</option>
            <option value="Expense">Expense</option>
          </select>
        </div>
        <button onclick="save()">Save Transaction</button>
      </div>

      <div class="card">
        <h3>📊 Summary</h3>
        <div id="summary">Loading...</div>
      </div>
    </div>

    <div class="card">
      <h3>📈 Recent Transactions</h3>
      <table>
        <thead>
          <tr>
            <th>Description</th>
            <th>Amount</th>
            <th>Type</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="transList">
          <tr>
            <td colspan="4" style="text-align: center;">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let currentUser = null;

    function init() {
      const user = JSON.parse(localStorage.getItem("user"));
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      currentUser = user;
      load();
    }

    function save() {
      const desc = document.getElementById("desc").value;
      const amount = document.getElementById("amount").value;
      const type = document.getElementById("type").value;

      if (!desc || !amount) {
        showMessage("Please fill in all fields", "error");
        return;
      }

      fetch("http://localhost:3000/api/finance/add", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "userid": currentUser.id,
          "role": currentUser.role
        },
        body: JSON.stringify({ description: desc, amount: parseFloat(amount), type })
      })
        .then(res => res.json())
        .then(() => {
          showMessage("Transaction saved!", "success");
          document.getElementById("desc").value = "";
          document.getElementById("amount").value = "";
          load();
        })
        .catch(() => showMessage("Error saving transaction", "error"));
    }

    function load() {
      fetch("http://localhost:3000/api/finance/summary", {
        headers: {
          "userid": currentUser.id,
          "role": currentUser.role
        }
      })
        .then(res => res.json())
        .then(data => {
          const summary = document.getElementById("summary");
          if (!data || data.length === 0) {
            summary.innerHTML = '<p style="color: #999;">No transactions yet</p>';
            return;
          }
          summary.innerHTML = data.map(d => `
            <p><strong>${d.type}:</strong> ₹${parseFloat(d.total).toFixed(2)}</p>
          `).join("");
        })
        .catch(() => {
          document.getElementById("summary").innerHTML = '<p style="color: red;">Error loading summary</p>';
        });
    }

    function logout(e) {
      e.preventDefault();
      localStorage.removeItem("user");
      window.location.href = "index.html";
    }

    window.onload = init;
  </script>
    </div>
  </div>
</body>
</html>
