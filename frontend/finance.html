<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance - Office Automation</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .finance-summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .summary-card {
      background: var(--bg-card);
      padding: 24px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .summary-value {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .summary-label {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    .text-success { color: var(--success); }
    .text-danger { color: var(--danger); }
  </style>
</head>
<body>
  <div style="display: flex;">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div class="container">
        <div id="message" class="alert" style="display: none;"></div>

        <div class="header-actions">
          <h1>💰 Finance Dashboard</h1>
        </div>

        <div id="summaryGrid" class="finance-summary-grid">
          <div class="summary-card">
            <div class="summary-value text-success">₹0.00</div>
            <div class="summary-label">Total Income</div>
          </div>
          <div class="summary-card">
            <div class="summary-value text-danger">₹0.00</div>
            <div class="summary-label">Total Expenses</div>
          </div>
          <div class="summary-card">
            <div class="summary-value">₹0.00</div>
            <div class="summary-label">Net Balance</div>
          </div>
        </div>

        <div class="grid" style="grid-template-columns: 1fr 2fr; gap: 24px;">
          <!-- Add Transaction Form -->
          <div class="card">
            <h3 class="mb-4">➕ Add Transaction</h3>
            <form onsubmit="save(event)">
              <div class="form-group">
                <label>Description</label>
                <input type="text" id="desc" placeholder="e.g. Office Supplies" required>
              </div>
              <div class="form-group">
                <label>Amount (₹)</label>
                <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required>
              </div>
              <div class="form-group">
                <label>Type</label>
                <select id="type" required>
                  <option value="Income">Income 🟢</option>
                  <option value="Expense">Expense 🔴</option>
                </select>
              </div>
              <button type="submit" class="btn-primary" style="width: 100%;">Save Transaction</button>
            </form>
          </div>

          <!-- Recent Transactions Table -->
          <div class="card">
            <h3 class="mb-4">📈 Recent Transactions</h3>
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Description</th>
                    <th>Amount</th>
                    <th>Type</th>
                    <th>Date</th>
                  </tr>
                </thead>
                <tbody id="transList">
                  <tr>
                    <td colspan="4" class="text-center">Loading...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Load Sidebar
    fetch('sidebar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('sidebar-container').innerHTML = data;
        const scripts = document.getElementById('sidebar-container').getElementsByTagName('script');
        for(let script of scripts) {
          eval(script.innerText);
        }
      });

    let currentUser = null;

    function init() {
      const user = JSON.parse(localStorage.getItem("user"));
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      currentUser = user;
      load();
      loadTransactions();
    }

    function save(e) {
      e.preventDefault();
      const desc = document.getElementById("desc").value;
      const amount = document.getElementById("amount").value;
      const type = document.getElementById("type").value;

      fetch("/api/finance/add", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "userid": currentUser.id,
          "role": currentUser.role
        },
        body: JSON.stringify({ description: desc, amount: parseFloat(amount), type })
      })
        .then(res => res.json())
        .then(() => {
          // Show simplified toast/alert
          const msg = document.getElementById("message");
          msg.textContent = "Transaction saved successfully!";
          msg.className = "alert success";
          msg.style.display = "block";
          setTimeout(() => msg.style.display = "none", 3000);

          document.getElementById("desc").value = "";
          document.getElementById("amount").value = "";
          load();
          loadTransactions();
        })
        .catch(() => {
          alert("Error saving transaction");
        });
    }

    function load() {
      fetch("/api/finance/summary", {
        headers: {
          "userid": currentUser.id,
          "role": currentUser.role
        }
      })
        .then(res => res.json())
        .then(data => {
          let income = 0;
          let expense = 0;

          if (data && data.length > 0) {
            data.forEach(d => {
              if (d.type === 'Income') income = d.total;
              if (d.type === 'Expense') expense = d.total;
            });
          }

          const balance = income - expense;

          document.getElementById("summaryGrid").innerHTML = `
            <div class="summary-card">
              <div class="summary-value text-success">₹${parseFloat(income).toFixed(2)}</div>
              <div class="summary-label">Total Income</div>
            </div>
            <div class="summary-card">
              <div class="summary-value text-danger">₹${parseFloat(expense).toFixed(2)}</div>
              <div class="summary-label">Total Expenses</div>
            </div>
            <div class="summary-card">
              <div class="summary-value" style="color: ${balance >= 0 ? 'var(--primary-color)' : 'var(--danger)'}">₹${parseFloat(balance).toFixed(2)}</div>
              <div class="summary-label">Net Balance</div>
            </div>
          `;
        })
        .catch(() => {
          console.error('Error loading summary');
        });
    }

    function loadTransactions() {
      fetch("/api/finance/list", {
        headers: {
          "userid": currentUser.id,
          "role": currentUser.role
        }
      })
      .then(res => res.json())
      .then(rows => {
        const tbody = document.getElementById("transList");
        if (!rows || rows.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="text-center">No transactions found</td></tr>';
          return;
        }

        tbody.innerHTML = rows.map(r => `
          <tr>
            <td style="font-weight: 500;">${r.description}</td>
            <td style="font-family: monospace; font-size: 1rem;">₹${parseFloat(r.amount).toFixed(2)}</td>
            <td><span class="badge ${r.type === 'Income' ? 'success' : 'danger'}">${r.type}</span></td>
            <td>${new Date(r.createdAt).toLocaleDateString()}</td>
          </tr>
        `).join("");
      })
      .catch(err => {
        console.error(err);
        document.getElementById("transList").innerHTML = '<tr><td colspan="4" class="text-center text-danger">Error loading transactions</td></tr>';
      });
    }

    window.onload = init;
  </script>
</body>
</html>
