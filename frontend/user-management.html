<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - Office Automation System</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .user-mgmt-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .form-section, .users-section {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .form-section h3 {
      color: #333;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid #007bff;
      padding-bottom: 0.5rem;
    }

    .users-section {
      margin-top: 20px;
    }

    .users-section h3 {
      color: #333;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid #28a745;
      padding-bottom: 0.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #333;
      font-weight: 500;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 1rem;
      font-family: Arial, sans-serif;
      box-sizing: border-box;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
    }

    .btn-create {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn-create:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 123, 255, 0.4);
    }

    .btn-create:active {
      transform: translateY(0);
    }

    .alert {
      padding: 1rem;
      border-radius: 4px;
      margin-bottom: 1rem;
      animation: slideDown 0.3s ease;
    }

    .alert.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .alert.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .alert.info {
      background-color: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .users-list {
      max-height: 600px;
      overflow-y: auto;
    }

    .user-card {
      background: #f9f9f9;
      padding: 1rem;
      border-radius: 4px;
      margin-bottom: 1rem;
      border-left: 4px solid #007bff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .user-info {
      flex: 1;
    }

    .user-info h4 {
      margin: 0 0 0.25rem 0;
      color: #333;
    }

    .user-info p {
      margin: 0.25rem 0;
      color: #666;
      font-size: 0.9rem;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-right: 0.5rem;
    }

    .badge.admin {
      background-color: #ff6b6b;
      color: white;
    }

    .badge.manager {
      background-color: #4dabf7;
      color: white;
    }

    .badge.staff {
      background-color: #69db7c;
      color: white;
    }

    .user-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn-small {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 4px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn-small:hover {
      transform: translateY(-2px);
    }

    .btn-edit {
      background-color: #ffc107;
      color: #333;
    }

    .btn-delete {
      background-color: #dc3545;
      color: white;
    }

    .btn-delete:hover {
      background-color: #c82333;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background-color: white;
      padding: 2rem;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .modal-header {
      margin-bottom: 1.5rem;
      border-bottom: 2px solid #007bff;
      padding-bottom: 0.5rem;
    }

    .modal-header h2 {
      margin: 0;
      color: #333;
    }

    .close-modal {
      float: right;
      font-size: 2rem;
      font-weight: bold;
      color: #aaa;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }

    .close-modal:hover {
      color: #000;
    }

    .modal-actions {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .btn-modal-submit {
      flex: 1;
      padding: 0.75rem;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-modal-submit:hover {
      background: #0056b3;
    }

    .btn-modal-cancel {
      flex: 1;
      padding: 0.75rem;
      background: #6c757d;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-modal-cancel:hover {
      background: #5a6268;
    }

    .filter-controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .filter-controls select {
      padding: 0.5rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 1rem;
      border-radius: 4px;
      text-align: center;
    }

    .stat-card h4 {
      margin: 0;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .stat-card p {
      margin: 0.5rem 0 0 0;
      font-size: 2rem;
      font-weight: bold;
    }

    @media (max-width: 1024px) {
      .user-mgmt-container {
        grid-template-columns: 1fr;
      }
    }

    .access-restricted {
      text-align: center;
      padding: 3rem 1rem;
    }

    .access-restricted h2 {
      color: #dc3545;
      margin-bottom: 1rem;
    }

    .access-restricted p {
      color: #666;
      font-size: 1.1rem;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: #666;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #007bff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Sidebar Navigation -->
  <div id="sidebar-container"></div>
  <script>
    fetch('sidebar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('sidebar-container').innerHTML = data;
        const scripts = document.getElementById('sidebar-container').getElementsByTagName('script');
        for(let script of scripts) {
          eval(script.innerText);
        }
      });
  </script>

  <!-- Main Content -->
  <div class="main-content">
    <div class="content-header">
      <h1>👤 User Management</h1>
      <p>Create, update, and manage system users</p>
    </div>

    <div id="noAccessDiv" class="access-restricted" style="display: none;">
      <h2>Access Restricted</h2>
      <p>Only administrators can access the User Management panel.</p>
      <a href="dashboard.html" style="color: #007bff; text-decoration: underline;">Back to Dashboard</a>
    </div>

    <div id="loadingDiv" class="loading" style="display: none;">
      <div class="spinner"></div>
      <p>Loading users...</p>
    </div>

    <div id="mainContent" style="display: none;">
      <!-- Stats Section -->
      <div class="stats">
        <div class="stat-card">
          <h4>Total Users</h4>
          <p id="totalUsersCount">0</p>
        </div>
        <div class="stat-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
          <h4>Admins</h4>
          <p id="adminsCount">0</p>
        </div>
        <div class="stat-card" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
          <h4>Active Users</h4>
          <p id="activeCount">0</p>
        </div>
      </div>

      <div class="user-mgmt-container">
        <!-- Create User Form -->
        <div class="form-section">
          <h3>➕ Create New User</h3>
          <div id="createAlert"></div>
          
          <form id="createUserForm">
            <div class="form-group">
              <label for="userName">Full Name *</label>
              <input type="text" id="userName" name="name" required placeholder="John Smith">
            </div>

            <div class="form-group">
              <label for="userEmail">Email Address *</label>
              <input type="email" id="userEmail" name="email" required placeholder="john@office.com">
            </div>

            <div class="form-group">
              <label for="userPassword">Password *</label>
              <input type="password" id="userPassword" name="password" required placeholder="Enter password">
            </div>

            <div class="form-group">
              <label for="userDepartment">Department *</label>
              <select id="userDepartment" name="department" required>
                <option value="">-- Select Department --</option>
                <option value="HR">HR</option>
                <option value="IT">IT</option>
                <option value="Finance">Finance</option>
                <option value="Sales">Sales</option>
                <option value="Operations">Operations</option>
                <option value="Marketing">Marketing</option>
              </select>
            </div>

            <div class="form-group">
              <label for="userRole">Role *</label>
              <select id="userRole" name="role" required>
                <option value="">-- Select Role --</option>
                <option value="Admin">Admin</option>
                <option value="Manager">Manager</option>
                <option value="Staff">Staff</option>
              </select>
            </div>

            <div class="form-group">
              <label for="userDesignation">Designation</label>
              <input type="text" id="userDesignation" name="designation" placeholder="e.g. Senior Developer">
            </div>

            <div class="form-group">
              <label for="userPhone">Phone</label>
              <input type="text" id="userPhone" name="phone" placeholder="+1234567890">
            </div>

            <div class="form-group">
              <label for="userManagerId">Reporting Manager ID</label>
              <input type="number" id="userManagerId" name="reportingManager" placeholder="Manager ID (Optional)">
            </div>

            <button type="submit" class="btn-create">Add Employee</button>
          </form>
        </div>

        <!-- Users List -->
        <div class="users-section">
          <h3>👥 Employee Directory</h3>
          
          <div class="filter-controls">
            <select id="departmentFilter" onchange="filterUsers()">
              <option value="">All Departments</option>
              <option value="HR">HR</option>
              <option value="IT">IT</option>
              <option value="Finance">Finance</option>
              <option value="Sales">Sales</option>
              <option value="Operations">Operations</option>
              <option value="Marketing">Marketing</option>
            </select>
            <select id="roleFilter" onchange="filterUsers()">
              <option value="">All Roles</option>
              <option value="Admin">Admin</option>
              <option value="Manager">Manager</option>
              <option value="Staff">Staff</option>
            </select>
          </div>

          <div class="users-list" id="usersList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit User Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Edit Employee</h2>
        <button class="close-modal" onclick="closeEditModal()">&times;</button>
      </div>
      <div id="editAlert"></div>
      <form id="editUserForm">
        <input type="hidden" id="editUserId">
        
        <div class="form-group">
          <label for="editName">Full Name</label>
          <input type="text" id="editName" placeholder="John Smith">
        </div>

        <div class="form-group">
          <label for="editEmail">Email</label>
          <input type="email" id="editEmail" placeholder="john@office.com">
        </div>

        <div class="form-group">
          <label for="editPassword">Password (leave empty to keep current)</label>
          <input type="password" id="editPassword" placeholder="New password (optional)">
        </div>

        <div class="form-group">
          <label for="editDepartment">Department</label>
          <select id="editDepartment">
            <option value="HR">HR</option>
            <option value="IT">IT</option>
            <option value="Finance">Finance</option>
            <option value="Sales">Sales</option>
            <option value="Operations">Operations</option>
            <option value="Marketing">Marketing</option>
          </select>
        </div>

        <div class="form-group">
          <label for="editRole">Role</label>
          <select id="editRole">
            <option value="Admin">Admin</option>
            <option value="Manager">Manager</option>
            <option value="Staff">Staff</option>
          </select>
        </div>

        <div class="form-group">
          <label for="editDesignation">Designation</label>
          <input type="text" id="editDesignation" placeholder="e.g. Senior Developer">
        </div>

        <div class="form-group">
          <label for="editPhone">Phone</label>
          <input type="text" id="editPhone" placeholder="+1234567890">
        </div>

        <div class="form-group">
          <label for="editManagerId">Reporting Manager ID</label>
          <input type="number" id="editManagerId" placeholder="Manager ID (Optional)">
        </div>

        <div class="form-group">
          <label for="editStatus">Status</label>
          <select id="editStatus">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>

        <div class="modal-actions">
          <button type="submit" class="btn-modal-submit">Update User</button>
          <button type="button" class="btn-modal-cancel" onclick="closeEditModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Check authorization
    document.addEventListener('DOMContentLoaded', () => {
      const userStr = localStorage.getItem('user');
      if (!userStr) {
        window.location.href = 'index.html';
        return;
      }

      const user = JSON.parse(userStr);
      const userRole = user.role;
      
      if (userRole && userRole.toLowerCase() === 'admin') {
        loadUsers();
        setupEventListeners();
      } else {
        document.getElementById('noAccessDiv').style.display = 'block';
      }
    });

    function setupEventListeners() {
      document.getElementById('createUserForm').addEventListener('submit', createUser);
      document.getElementById('editUserForm').addEventListener('submit', updateUser);
    }

    let allUsers = [];

    async function loadUsers() {
      document.getElementById('mainContent').style.display = 'none';
      document.getElementById('loadingDiv').style.display = 'block';

      try {
        const user = JSON.parse(localStorage.getItem('user'));
        const response = await fetch('/api/users/all', {
          headers: {
            'userid': user.id,
            'role': user.role,
          },
        });

        const data = await response.json();

        if (data.success) {
          allUsers = data.users; // Cache users
          displayUsers(allUsers);
          updateStats(allUsers);
          document.getElementById('mainContent').style.display = 'block';
          document.getElementById('loadingDiv').style.display = 'none';
        } else {
          document.getElementById('loadingDiv').style.display = 'none';
          document.getElementById('mainContent').style.display = 'block';
          showAlert('Error loading users: ' + data.message, 'error', 'createAlert');
        }
      } catch (error) {
        document.getElementById('loadingDiv').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        showAlert('Error: ' + error.message, 'error', 'createAlert');
      }
    }

    function updateStats(users) {
      document.getElementById('totalUsersCount').textContent = users.length;
      document.getElementById('adminsCount').textContent = users.filter(u => u.role === 'Admin').length;
      document.getElementById('activeCount').textContent = users.filter(u => u.status === 'Active').length;
    }

    function displayUsers(users) {
      const usersList = document.getElementById('usersList');
      usersList.innerHTML = '';

      if (users.length === 0) {
        usersList.innerHTML = '<p style="text-align: center; color: #666;">No users found</p>';
        return;
      }

      // Use DocumentFragment for better performance
      const fragment = document.createDocumentFragment();

      users.forEach(user => {
        const createdDate = new Date(user.createdAt).toLocaleDateString();
        const roleClass = user.role.toLowerCase();
        
        const userCard = document.createElement('div');
        userCard.className = 'user-card';
        userCard.innerHTML = `
          <div class="user-info">
            <h4>${user.name}</h4>
            <p>📧 ${user.email}</p>
            <p>🏢 ${user.department}</p>
            ${user.designation ? `<p>💼 ${user.designation}</p>` : ''}
            ${user.phone ? `<p>📱 ${user.phone}</p>` : ''}
            <p style="font-size: 0.85rem; color: #999;">Joined: ${createdDate}</p>
            <div>
              <span class="badge ${roleClass}">${user.role}</span>
              <span class="badge" style="background: ${user.status === 'Active' ? '#28a745' : '#6c757d'}; color: white;">
                ${user.status}
              </span>
            </div>
          </div>
          <div class="user-actions">
            <button class="btn-small btn-edit" onclick="openEditModal(${user.id})">Edit</button>
            <button class="btn-small btn-delete" onclick="deleteUser(${user.id}, '${user.name.replace(/'/g, "\\'")}')">Delete</button>
          </div>
        `;
        fragment.appendChild(userCard);
      });
      
      usersList.appendChild(fragment);
    }

    function filterUsers() {
      const dept = document.getElementById('departmentFilter').value;
      const role = document.getElementById('roleFilter').value;

      let filtered = allUsers;
      if (dept) filtered = filtered.filter(u => u.department === dept);
      if (role) filtered = filtered.filter(u => u.role === role);
      
      displayUsers(filtered);
    }

    async function createUser(e) {
      e.preventDefault();

      const name = document.getElementById('userName').value;
      const email = document.getElementById('userEmail').value;
      const password = document.getElementById('userPassword').value;
      const department = document.getElementById('userDepartment').value;
      const role = document.getElementById('userRole').value;
      const designation = document.getElementById('userDesignation').value;
      const phone = document.getElementById('userPhone').value;
      const reportingManager = document.getElementById('userManagerId').value;

      if (!name || !email || !password || !department || !role) {
        showAlert('All fields are required', 'error', 'createAlert');
        return;
      }

      try {
        const user = JSON.parse(localStorage.getItem('user'));
        const response = await fetch('/api/users/create', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'userid': user.id,
            'userrole': user.role,
          },
          body: JSON.stringify({ name, email, password, department, role, designation, phone, reportingManager }),
        });

        const data = await response.json();

        if (data.success) {
          showAlert('✓ User created successfully!', 'success', 'createAlert');
          document.getElementById('createUserForm').reset();
          loadUsers(); // Reload immediately
        } else {
          console.error('Create user error:', data);
          showAlert('Error: ' + data.message, 'error', 'createAlert');
        }
      } catch (error) {
        console.error('Create user exception:', error);
        showAlert('Error: ' + error.message, 'error', 'createAlert');
      }
    }

    function openEditModal(userId) {
      const user = allUsers.find(u => u.id === userId);
      if (!user) {
        console.error('User not found:', userId);
        return;
      }

      document.getElementById('editUserId').value = user.id;
      document.getElementById('editName').value = user.name;
      document.getElementById('editEmail').value = user.email;
      document.getElementById('editDepartment').value = user.department;
      document.getElementById('editRole').value = user.role;
      document.getElementById('editStatus').value = user.status;
      document.getElementById('editPhone').value = user.phone || '';
      document.getElementById('editDesignation').value = user.designation || '';
      document.getElementById('editManagerId').value = user.reportingManager || '';
      document.getElementById('editPassword').value = '';
      document.getElementById('editAlert').innerHTML = '';
      document.getElementById('editModal').classList.add('active');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.remove('active');
    }

    async function updateUser(e) {
      e.preventDefault();

      const userId = document.getElementById('editUserId').value;
      const updates = {};

      const name = document.getElementById('editName').value;
      const email = document.getElementById('editEmail').value;
      const password = document.getElementById('editPassword').value;
      const department = document.getElementById('editDepartment').value;
      const role = document.getElementById('editRole').value;
      const status = document.getElementById('editStatus').value;
      const phone = document.getElementById('editPhone').value;
      const designation = document.getElementById('editDesignation').value;
      const reportingManager = document.getElementById('editManagerId').value;

      if (name) updates.name = name;
      if (email) updates.email = email;
      if (password) updates.password = password;
      if (department) updates.department = department;
      if (role) updates.role = role;
      if (status) updates.status = status;
      if (phone) updates.phone = phone;
      if (designation) updates.designation = designation;
      if (reportingManager) updates.reportingManager = reportingManager;

      if (Object.keys(updates).length === 0) {
        showAlert('Please make at least one change', 'error', 'editAlert');
        return;
      }

      try {
        const user = JSON.parse(localStorage.getItem('user'));
        const response = await fetch(`/api/users/${userId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'userid': user.id,
            'role': user.role,
          },
          body: JSON.stringify(updates),
        });

        const data = await response.json();

        if (data.success) {
          showAlert('✓ User updated successfully!', 'success', 'editAlert');
          setTimeout(() => {
            closeEditModal();
            loadUsers();
          }, 1500);
        } else {
          showAlert('Error: ' + data.message, 'error', 'editAlert');
        }
      } catch (error) {
        showAlert('Error: ' + error.message, 'error', 'editAlert');
      }
    }

    async function deleteUser(userId, userName) {
      if (!confirm(`Are you sure you want to delete "${userName}"?`)) return;

      try {
        const user = JSON.parse(localStorage.getItem('user'));
        const response = await fetch(`/api/users/${userId}`, {
          method: 'DELETE',
          headers: {
            'userid': user.id,
            'role': user.role,
          },
        });

        const data = await response.json();

        if (data.success) {
          showAlert('✓ User deleted successfully!', 'success', 'createAlert');
          setTimeout(() => loadUsers(), 1500);
        } else {
          showAlert('Error: ' + data.message, 'error', 'createAlert');
        }
      } catch (error) {
        showAlert('Error: ' + error.message, 'error', 'createAlert');
      }
    }

    function showAlert(message, type, elementId) {
      const alertDiv = document.getElementById(elementId);
      alertDiv.innerHTML = `<div class="alert ${type}">${message}</div>`;
      setTimeout(() => {
        alertDiv.innerHTML = '';
      }, 5000);
    }

    function logout() {
      localStorage.removeItem('user');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
