<script>
  // Set active sidebar item based on current page
  function setActiveSidebarItem() {
    const currentPage = window.location.pathname.split('/').pop() || 'dashboard.html';
    const navId = 'nav-' + currentPage.replace('.html', '');
    const activeElement = document.getElementById(navId);
    
    if (activeElement) {
      document.querySelectorAll('.sidebar-nav a').forEach(el => el.classList.remove('active'));
      activeElement.classList.add('active');
    }
  }

  // Set active item on page load
  setActiveSidebarItem();

  // Show Manager Tools if user is Manager or Admin
  const currentUser = JSON.parse(localStorage.getItem('user') || '{}');
  if (['Manager', 'Admin'].includes(currentUser.role)) {
    const managerLink = document.getElementById('nav-manager-tools');
    if (managerLink) managerLink.style.display = 'block';
  }

  // Show User Management if user is Admin
  if (currentUser.role === 'Admin') {
    const usersLink = document.getElementById('nav-users');
    if (usersLink) usersLink.style.display = 'block';
  }
</script>
