<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks - Office Automation</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .task-card {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
    }

    .tab-container {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 500;
      transition: var(--transition);
    }

    .tab-btn.active {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    .priority-select {
      width: 100%;
      padding: 10px;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
    }

    .action-btn-group {
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div style="display: flex;">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div class="container">
        <div id="message" class="alert" style="display: none;"></div>

        <div class="header-actions">
          <h1>✅ Task Management</h1>
          <button class="btn-primary" onclick="showCreateTaskModal()">+ New Task</button>
        </div>

        <!-- Admin Task Creation Section -->
        <div id="adminTaskCreation" style="display: none;" class="task-card">
          <h3 class="mb-4">🆕 Create & Assign Task</h3>
          
          <div class="tab-container">
            <button type="button" onclick="toggleTab('manual')" id="btn-manual" class="tab-btn active">Manual Assignment</button>
            <button type="button" onclick="toggleTab('auto')" id="btn-auto" class="tab-btn">Auto Assignment (AI)</button>
          </div>

          <!-- Manual Assignment Tab -->
          <form id="taskForm" style="display: block;">
            <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 20px;">
              <div class="form-group">
                <label>Title</label>
                <input type="text" id="taskTitle" required>
              </div>
              <div class="form-group">
                <label>Department</label>
                <input type="text" id="taskDept" required>
              </div>
            </div>
            <div class="form-group">
              <label>Description</label>
              <textarea id="taskDesc" rows="3"></textarea>
            </div>
             <div class="form-group">
                <label>Assign To (Employee ID)</label>
                <input type="number" id="taskAssignee" placeholder="Optional">
              </div>
            <button type="button" class="btn-primary" onclick="createTask()">Create Task</button>
          </form>

          <!-- Auto Assignment Tab -->
          <form id="autoTaskForm" style="display: none;">
            <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 20px;">
              <div class="form-group">
                <label>Title</label>
                <input type="text" id="autoTaskTitle" required>
              </div>
              <div class="form-group">
                <label>Department</label>
                <select id="autoTaskDept" class="priority-select" required>
                  <option value="">Select Department</option>
                  <option value="IT">IT</option>
                  <option value="HR">HR</option>
                  <option value="Finance">Finance</option>
                  <option value="Sales">Sales</option>
                  <option value="Operations">Operations</option>
                  <option value="Marketing">Marketing</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Description</label>
              <textarea id="autoTaskDesc" rows="3"></textarea>
            </div>
            <div class="form-group">
              <label>Priority</label>
              <select id="taskPriority" class="priority-select">
                <option value="Low">Low</option>
                <option value="Normal" selected>Normal</option>
                <option value="High">High</option>
                <option value="Urgent">Urgent</option>
              </select>
            </div>
            <button type="button" class="btn-primary" style="background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); border: none;" onclick="autoAssignTask()">✨ Auto Assign to Best Fit</button>
            <div id="autoAssignResult" style="margin-top: 10px; display: none;" class="alert"></div>
          </form>
        </div>

        <!-- Task List -->
        <div class="card">
          <h3 class="mb-4">📋 Your Tasks</h3>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Department</th>
                  <th>Priority</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="taskTableBody">
                <tr><td colspan="5" class="text-center">Loading tasks...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Load Sidebar
    fetch('sidebar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('sidebar-container').innerHTML = data;
        const scripts = document.getElementById('sidebar-container').getElementsByTagName('script');
        for(let script of scripts) {
          eval(script.innerText);
        }
      });

    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) window.location.href = 'index.html';

    // Show Admin Features
    if (['Admin', 'Manager'].includes(user.role)) {
      document.getElementById('adminTaskCreation').style.display = 'block';
    }

    function toggleTab(tab) {
      if (tab === 'manual') {
        document.getElementById('taskForm').style.display = 'block';
        document.getElementById('autoTaskForm').style.display = 'none';
        document.getElementById('btn-manual').classList.add('active');
        document.getElementById('btn-auto').classList.remove('active');
      } else {
        document.getElementById('taskForm').style.display = 'none';
        document.getElementById('autoTaskForm').style.display = 'block';
        document.getElementById('btn-manual').classList.remove('active');
        document.getElementById('btn-auto').classList.add('active');
      }
    }

    function loadTasks() {
      fetch(`/api/tasks/${user.id}`, {
        headers: { 'userid': user.id, 'role': user.role }
      })
      .then(res => res.json())
      .then(tasks => {
        const tbody = document.getElementById('taskTableBody');
        if (tasks.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center">No tasks found</td></tr>';
          return;
        }
        
        tbody.innerHTML = tasks.map(task => `
          <tr>
            <td style="font-weight: 500;">
              ${task.title}
              <div style="font-size: 0.8rem; color: var(--text-muted);">${task.description || ''}</div>
            </td>
            <td>${task.department || '-'}</td>
            <td><span class="badge ${getPriorityClass(task.priority)}">${task.priority || 'Normal'}</span></td>
            <td><span class="badge ${getStatusClass(task.status)}">${task.status}</span></td>
            <td>
              <div class="action-btn-group">
                ${getActionButtons(task)}
              </div>
            </td>
          </tr>
        `).join('');
      })
      .catch(err => console.error(err));
    }

    function getPriorityClass(p) {
      if (p === 'Urgent') return 'danger';
      if (p === 'High') return 'warning';
      return 'info';
    }

    function getStatusClass(s) {
      if (s === 'Completed') return 'success';
      if (s === 'In Progress') return 'warning';
      if (s === 'Declined') return 'danger';
      return 'inactive'; // Pending
    }

    function getActionButtons(task) {
      if (task.status === 'Pending') {
        return `
          <button class="btn-sm success" onclick="respondTask(${task.id}, 'Accepted')">Accept</button>
          <button class="btn-sm danger" onclick="respondTask(${task.id}, 'Declined')">Decline</button>
        `;
      } else if (task.status === 'Accepted' || task.status === 'In Progress') {
        return `
          <button class="btn-sm success" onclick="respondTask(${task.id}, 'Completed')">Mark Done</button>
        `;
      }
      return '<span class="text-muted">-</span>';
    }

    function respondTask(taskId, status) {
      let reason = '';
      if (status === 'Declined') {
        reason = prompt("Please provide a reason for declining:");
        if (!reason) return; // Cancelled
      }

      fetch('/api/tasks/respond', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'userid': user.id 
        },
        body: JSON.stringify({ taskId, status, reason })
      })
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          alert(data.error);
        } else {
          if (data.reassignedTo) {
             alert(`Task declined and auto-reassigned to ${data.reassignedTo}`);
          } else {
             alert(`Task ${status}`);
          }
          loadTasks();
        }
      })
      .catch(err => console.error(err));
    }

    function createTask() {
      const title = document.getElementById('taskTitle').value;
      const desc = document.getElementById('taskDesc').value;
      const dept = document.getElementById('taskDept').value;
      const assignee = document.getElementById('taskAssignee').value;

      fetch('/api/tasks/create', {
        method: 'POST',
        headers: { 
            'Content-Type': 'application/json', 
            'userid': user.id,
            'role': user.role 
        },
        body: JSON.stringify({ title, description: desc, department: dept, assignedTo: assignee })
      })
      .then(res => res.json())
      .then(data => {
        if(data.error) alert(data.error);
        else {
            alert('Task created!');
            loadTasks();
        }
      });
    }

    function autoAssignTask() {
      const title = document.getElementById('autoTaskTitle').value;
      const desc = document.getElementById('autoTaskDesc').value;
      const dept = document.getElementById('autoTaskDept').value;
      const priority = document.getElementById('taskPriority').value;
      
      const resultDiv = document.getElementById('autoAssignResult');
      resultDiv.style.display = 'block';
      resultDiv.className = 'alert info';
      resultDiv.textContent = '🤖 AI is analyzing workload to find best employee...';

      fetch('/api/tasks/auto-assign', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'userid': user.id },
        body: JSON.stringify({ title, description: desc, department: dept, priority })
      })
      .then(res => res.json())
      .then(data => {
        if (data.error) {
             resultDiv.className = 'alert error';
             resultDiv.textContent = data.error;
        } else {
            resultDiv.className = 'alert success';
            resultDiv.textContent = `✅ Assigned to ${data.assignedTo || 'Employee'} (Load: ${data.currentWorkload || 0} tasks)`;
            loadTasks();
        }
      })
      .catch(err => {
        resultDiv.className = 'alert error';
        resultDiv.textContent = 'Failed to auto-assign';
      });
    }
    
    function showCreateTaskModal() {
        if (['Admin', 'Manager'].includes(user.role)) {
             document.getElementById('adminTaskCreation').scrollIntoView({behavior: "smooth"});
        } else {
            alert("Only Admins and Managers can create tasks.");
        }
    }

    window.onload = loadTasks;
  </script>
</body>
</html>
